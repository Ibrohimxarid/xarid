# TASHKENT POLYTECHNIC MUSEUM RELEVANCE CHECK
#
# Relevance is decided by rules over two facts recorded for every object:
#   1. its categories (what subject it belongs to), and
#   2. its object_type (what it physically is: interactive station, cutaway,
#      engine, vehicle, book, vitrine ...).
# No subjective scores. The rules live in src/mef/relevance.py; this file holds
# the vocabularies so they can be reviewed and changed without touching code.

museum_profile:
  - Automotive technology
  - Transport technology
  - Engineering
  - Mechanics
  - Physics
  - Electricity
  - Optics
  - Robotics
  - Industrial technology
  - STEM education
  - Interactive science
  - Technology history

# Profile areas from the TPM brief. A* = priority group A (high value), B = useful.
areas:
  A1: Automotive technology
  A2: Transport (rail, aviation, ships, traffic)
  A3: Physics — interactive (mechanics, fluids, waves, optics, electricity & magnetism)
  A4: Robotics & automation
  A5: Engineering (structures, machines, hydraulics, manufacturing systems)
  A6: Energy technology
  A7: STEM interactive exhibits
  A8: Digital / immersive technology
  A9: Automotive manufacturing
  B: Useful (aviation/railway exhibits, industrial & agricultural machinery, telecoms, electronics, computing history, materials, environment, space)

category_area:
  automotive: A1
  transport: A2
  aviation: A2
  railway: A2
  maritime: A2
  traffic: A2
  simulator: A2
  physics: A3
  mechanics: A3
  fluid_mechanics: A3
  acoustics: A3
  optics: A3
  electricity: A3
  magnetism: A3
  thermodynamics: A3
  robotics: A4
  automation: A4
  engineering: A5
  industrial: A5
  energy: A6
  stem: A7
  digital_interactive: A8
  manufacturing: A9
  computing: B
  telecommunications: B
  electronics: B
  space: B
  agriculture: B
  materials: B
  environment: B

# Categories that never qualify (brief: EXCLUDE list).
excluded_categories:
  - display_cases
  - furniture
  - books
  - documents
  - art
  - archaeology
  - natural_history
  - clothing
  - decorative

object_type_groups:
  # complete educational experiences — the most wanted objects
  demonstration: [interactive_station, demonstrator, cutaway, simulator, robot, digital_installation]
  # real technology objects (static exhibits)
  real_technology: [engine, vehicle, aircraft, rolling_stock, machine, instrument, computer, model]
  partial: [component]
  low_value: [household]
  excluded: [display_furniture, book_document, decorative]
  not_itemised: [mixed_collection, unspecified]

