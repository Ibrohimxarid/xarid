museum:
  id: air-terminal-museum-houston
  name: 1940 Air Terminal Museum
  country: United States
  city: Houston, Texas
  website: https://www.1940airterminal.org/
  type: aviation history museum (closed March 2026)
contacts:
  - kind: general
    email: info@1940airterminal.org
    contact_page: https://www.1940airterminal.org/
    source: e5
exhibitions:
  - id: liquidation-2026
    name: Sale of non-core assets before vacating Hobby Airport (May–June 2026)
    replacement_year: "2026"
    status: for_sale
    evidence: [e1, e2, e3, e4]
    exhibits:
      - id: sw-737-200-simulator
        name: Southwest Airlines' first Boeing 737-200 full-motion flight simulator
        category: [aviation, simulator]
        object_type: simulator
        transport: oversize
        condition: Not powered on since the museum received it; functional capacity unknown (per listing)
        status: for_sale
        evidence: [e1, e3, e5]
        fit_for_tpm: Full-size airliner cockpit on a motion platform — visitors sit at real flight controls and instruments and see how pilots fly and how motion simulators reproduce flight; usable even as a static cockpit.
        notes: Asking price USD 20,000 (May 2026); buyer arranges removal; a forklift rated ≥22,700 lb is needed; sold with computer cabinets and manuals.
      - id: king-air-200-simulator
        name: Beechcraft King Air 200 full-motion flight simulator (donated by FlightSafety)
        category: [aviation, simulator]
        object_type: simulator
        transport: oversize
        condition: Not powered on since the museum received it; functional capacity unknown (per listing)
        status: for_sale
        evidence: [e1, e3, e5]
        fit_for_tpm: Turboprop flight-deck simulator — shows cockpit instruments, flight controls and the principle of motion-based flight simulation for pilot training.
        notes: Asking price USD 20,000 (May 2026); buyer arranges removal.
      - id: hawker-700-simulator
        name: Hawker 700 business-jet full-motion flight simulator (donated by FlightSafety)
        category: [aviation, simulator]
        object_type: simulator
        transport: oversize
        condition: Not powered on since the museum received it; functional capacity unknown (per listing)
        status: for_sale
        evidence: [e1, e3, e5]
        fit_for_tpm: Business-jet flight-deck simulator — shows jet cockpit instruments, flight controls and motion-based flight simulation for pilot training.
        notes: Asking price USD 20,000 (May 2026); buyer arranges removal.
      - id: link-ifr-trainer
        name: Link instrument-flight (IFR) trainer
        category: [aviation, simulator]
        object_type: simulator
        status: for_sale
        evidence: [e3]
        fit_for_tpm: Classic Link instrument-flight trainer — the pioneering electromechanical flight simulator used to teach pilots to fly on instruments; a technology-history landmark for TPM's aviation and simulator areas.
        notes: Listed for sale in May 2026 (USD 20,000 per item per the Houston Chronicle); size and weight not captured.
      - id: dc6-nose
        name: Douglas DC-6 nose / cockpit section (cut from N841TA, mounted on a trailer)
        category: [aviation]
        object_type: aircraft
        transport: oversize
        status: for_sale
        evidence: [e2, e3]
        fit_for_tpm: Airliner cockpit section visitors can enter — shows the flight deck, instruments and airframe structure of a 1950s piston airliner.
      - id: lodestar-n31g
        name: 1942 Lockheed Lodestar N31G aircraft
        category: [aviation]
        object_type: aircraft
        transport: oversize
        status: for_sale
        evidence: [e3]
        fit_for_tpm: Complete 1940s twin-engine piston airliner — shows radial engines, propellers and early airliner structure.
