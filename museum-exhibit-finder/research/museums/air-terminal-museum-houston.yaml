research:
  researcher: mef relevance pass
  last_updated: "2026-10-02"
  international_transfer: "yes"
  eligibility: Was an open sale (USD 20,000 per item, buyer removes); since 1 July 2026 artifact removal is paused while the Texas Historical Commission evaluates the collection, and only limited 'non-core assets' are sold.
  summary_ru: Музей истории авиации в Хьюстоне закрылся в марте 2026 и в мае–июне продавал по 20 000 $ три полноразмерных авиасимулятора с подвижной платформой (Boeing 737-200, King Air 200, Hawker 700), классический тренажёр Link, кабину DC-6 и самолёт Lodestar. Срок освобождения здания — 30 июня 2026; с 1 июля Комиссия по историческому наследию Техаса арендовала здание и приостановила вывоз, музей продаёт лишь ограниченные «непрофильные активы». Симуляторы не включались с момента поступления, нужен погрузчик на 10+ т.
  next_step: Email info@1940airterminal.org — ask which simulators and the Link trainer are still unsold or count as 'non-core assets', their weight and dimensions, and whether the Texas Historical Commission's review blocks a sale abroad.
  outreach:
    reason: The museum offered its flight simulators, a Link trainer and a DC-6 nose for sale in May–June 2026.
    interest: The Link IFR trainer and, if still available, one of the full-motion simulator cockpits.
    fit: Flight simulators and cockpits give TPM's aviation section hands-on exhibits for school groups.
    email_hook: in May 2026 the museum offered its full-motion flight simulators, a Link IFR trainer and a DC-6 nose section for sale
    source: e3
