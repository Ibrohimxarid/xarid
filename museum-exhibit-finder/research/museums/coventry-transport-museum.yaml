research:
  summary_ru: "Совет Ковентри 26.02.2026 одобрил списание предметов коллекции (Транспортный музей, Herbert, хранилища). Списанное сначала предлагают аккредитованным музеям через Find an Object, затем другим организациям; передача за пределы Ковентри приветствуется. Перечень предметов не получен — запросить."
  eligibility: "Offered first to accredited museums via Find an Object; if no interest, to other appropriate organisations (transfers outside Coventry welcomed)."
  researcher: mef expansion
  last_updated: "2026-09-30"
  next_step: Open the Feb 2026 council report; ask the collections team which transport/engineering items remain unallocated after the Find an Object period and whether an overseas public museum can apply.
  outreach:
    reason: Coventry Transport Museum is disposing of collection items after its Collections Review, first offering them to other museums.
    interest: Vehicles, engines, cycles and engineering objects on the approved disposal list.
    fit: Coventry is the historic heart of the British motor and cycle industry — directly relevant to TPM's automotive theme.
    email_hook: Culture Coventry's Collections Review has identified items for disposal, which are being offered to other museums
    source: e1
