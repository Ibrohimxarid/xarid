  summary_ru: Национальный научный музей Гвачхона (Южная Корея) ведёт программу «다시ON» — снятые интерактивные экспонаты не утилизируют, а передают другим учреждениям. С 2023 года передано 53 экспоната; в 2026 году 10 экспонатов (в т.ч. интерактивный «Одинаковый объём — разный вес») ушли четырём корейским музеям. Иностранные получатели в источнике не упоминаются — спросить о следующем раунде.
  next_step: Ask the exhibition team when the next 다시ON round is planned, which retired exhibits it will include, and whether a foreign state museum may be a recipient (TPM pays packing and transport).
