research:
  researcher: mef pilot
  last_updated: "2026-09-30"
  next_step: Ask HOP specifically for used / end-of-tour exhibitions or retired exhibits from Heureka's own floor (not new copies), with prices.
  open_questions:
    - Which exhibitions have finished touring and could be sold second-hand?
    - Do they retire exhibits from Heureka's own permanent floor, and what happens to them?
  notes: Commercial offer — new exhibit copies are out of scope; only used/retired exhibitions match the brief.
  outreach:
    reason: Heureka sells and rents touring exhibitions internationally through Heureka Overseas Productions.
    interest: Used or end-of-tour exhibitions, especially the Classic Collection of physics/optics exhibits and Power of Play.
    fit: Durable, containerised hands-on physics exhibits proven in ~30 countries — easy to ship to Tashkent.
    email_hook: Heureka Overseas Productions offers Heureka's touring exhibitions for rental and sale, and we are particularly interested in exhibitions that have completed their tours or exhibits retired from Heureka's own galleries.
    source: e1
