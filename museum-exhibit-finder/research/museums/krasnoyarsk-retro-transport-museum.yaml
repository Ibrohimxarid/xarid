  eligibility: No sale procedure published; the owner and his partners decide; buyers from other Russian regions have shown interest.
  summary_ru: Частный музей советской техники в Красноярске (около 120 машин, грузовиков и мотоциклов) закрылся 1 июня 2026. Около 50 машин и 15 мотоциклов принадлежат партнёрам владельца и, по его словам, при закрытии будут проданы или вывезены в другие регионы; покупатели из Москвы, Новокузнецка и Владивостока уже интересуются. Официального объявления о продаже нет — нужно связаться с владельцем (Александр Кнапнугель). Близко к профилю TPM (советская автотехника), доставка автотранспортом в Ташкент реальна.
  next_step: Reach the owner Alexander Knapnugel through the Krasnoyarsk media (NGS24 / Prima TV) — ask whether vehicles are for sale, prices and condition, and check Russian export rules for historic vehicles to Uzbekistan.
