research:
  summary_ru: "Смитсоновский музей авиации и космонавтики периодически публикует список списанных предметов для передачи квалифицированным музеям и образовательным организациям; первыми предложение получают члены международного консорциума Mutual Concerns of Air and Space Museums. Актуальный список не получен."
  researcher: mef verification
  last_updated: "2026-09-30"
  eligibility: Qualified museums and educational organisations; outreach starts with the international "Mutual Concerns of Air and Space Museums" consortium (foreign museums can be members). US private recipients need 501(c)(3) status — foreign eligibility to be confirmed.
  next_step: Open the transfer page, download the current list, and ask NASM Collections how a foreign state museum can request objects (and whether TPM can join the Mutual Concerns consortium).
  open_questions:
    - Is the 2025/2026 transfer list published, and which items remain?
    - Can a non-US state museum receive transfers? Who pays shipping?
  outreach:
    reason: NASM publishes a list of deaccessioned objects available for transfer to museums, with outreach first to an international consortium of air and space museums.
    interest: Aircraft components, engines, instruments and models on the current transfer list.
    fit: Aviation and space engineering objects from the US national collection would anchor TPM's aviation section.
    email_hook: the Museum periodically offers deaccessioned objects to other museums through its Collection Items for Transfer programme, with outreach beginning with the international Mutual Concerns of Air and Space Museums community
    source: e4
