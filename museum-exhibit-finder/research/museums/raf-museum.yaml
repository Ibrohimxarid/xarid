research:
  eligibility: "Priority to UK public-heritage organisations; after that the Museum explores 'alternative routes' (per Feb 2026 transfer list). Expressions of interest must state organisation status, contacts and accession numbers."
  researcher: mef expansion
  last_updated: "2026-09-30"
  next_step: Email the Collections Development Committee now — ask which aircraft from the 2025/2026 batches were not taken by UK bodies (SR.53, H.126) and whether a foreign public museum can apply under "alternative routes".
  open_questions:
    - Are overseas public museums eligible once UK interest is exhausted?
    - Transport/export logistics for large airframes (dismantling needed?).
  outreach:
    reason: The RAF Museum is transferring aircraft from its national collection; several (SR.53, H.126) were still awaiting new homes.
    interest: Saunders-Roe SR.53 XD145, Hunting H.126 XN714, and other research/test aircraft or engines in current transfer batches.
    fit: Landmark British aviation engineering; would anchor an aviation section at TPM.
    email_hook: the Museum's Objects Transfer Programme is offering aircraft from the national collection, and that the Saunders-Roe SR.53 and Hunting H.126 were still awaiting new homes
    source: e4
