    language: nl
    claim: The Spoorwegmuseum is deaccessioning rolling stock (duplicates, parts donors, vehicles in very poor condition); selected objects are registered on the Museumvereniging Afstotingsdatabase and the list is shared with Historisch Railvervoer Nederland so others can adopt them.
