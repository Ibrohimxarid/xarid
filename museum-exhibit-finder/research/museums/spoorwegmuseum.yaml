research:
  summary_ru: "Железнодорожный музей Нидерландов списывает подвижной состав (дубли, доноры запчастей, единицы в очень плохом состоянии) через голландскую базу списаний Afstotingsdatabase; по правилам LAMO сначала — музеи Нидерландов. Спросить, что осталось невостребованным."
  eligibility: "Under LAMO: offered first to Dutch museums/heritage institutions and Historisch Railvervoer Nederland members; afterwards other routes."
  researcher: mef expansion
  last_updated: "2026-09-30"
  next_step: Ask the collections team for the current list of rolling stock/components still unallocated after the LAMO period, and whether a foreign museum may take them.
  open_questions:
    - Which vehicles remain unallocated after Dutch museums and HRN members were offered them?
  outreach:
    reason: The Spoorwegmuseum is deaccessioning surplus rolling stock and publishes it on the Dutch disposal database.
    interest: Surplus locomotives, carriages, bogies and railway components from the rolling-stock review.
    fit: Railway engineering is a core TPM theme.
    email_hook: the Spoorwegmuseum is deaccessioning part of its rolling stock following its collection review, first offering it to other museums and heritage railways
    source: e1
