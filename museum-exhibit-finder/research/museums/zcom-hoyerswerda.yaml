  summary_ru: Компьютерный музей Цузе (ZCOM) в Хойерсверде (Германия) закрылся 1 сентября 2026 из-за нехватки финансирования. Около 18 000 экспонатов, включая действующую модель механического компьютера Z1, ЭВМ «Роботрон» (ГДР) и перфокарточные машины. Судьба коллекции не решена — предложений о передаче нет.
